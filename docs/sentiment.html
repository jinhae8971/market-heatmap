<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>투자자 센티멘트 · 마켓 히트맵</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --line:#232a32; --txt:#e8edf2; --dim:#8b97a4;
    --greed:#e2394a; --fear:#2e8fd6; --mid:#8b97a4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'IBM Plex Sans KR',system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 80px}

  .mode{display:flex;gap:6px;margin-bottom:12px}
  .mode a{flex:1;text-align:center;padding:8px;border-radius:9px;text-decoration:none;
    border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:13px}
  .mode a.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:600}

  header{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}
  h1{font-size:18px;margin:0;letter-spacing:-.02em}
  .stamp{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim)}

  /* 시그니처: 공포–탐욕 눈금자. 두 시장을 같은 자에 올려야 비교가 성립한다 */
  .rulers{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:16px 14px 10px}
  .ruler{margin-bottom:20px}
  .ruler:last-child{margin-bottom:6px}
  .rtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .rtop b{font-size:15px}
  .rtop span{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600}
  .track{position:relative;height:12px;border-radius:6px;
    background:linear-gradient(90deg,#2e8fd6 0%,#1d4a6b 25%,#2b3138 50%,#7a2733 75%,#e2394a 100%)}
  .pin{position:absolute;top:-5px;width:3px;height:22px;background:#fff;border-radius:2px;
    box-shadow:0 0 0 2px rgba(0,0,0,.55)}
  .rlab{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);
    margin-top:6px;font-family:'IBM Plex Mono',monospace}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);
    margin:26px 0 8px;font-weight:600}
  .segs{display:flex;gap:5px;margin-bottom:10px}
  .seg{padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--dim);font-size:12.5px;cursor:pointer;font-family:inherit}
  .seg.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:600}

  .comp{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px}
  .crow{display:grid;grid-template-columns:112px 1fr 40px;gap:9px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:0}
  .crow .nm{font-size:12.5px}
  .crow .nm em{display:block;font-style:normal;font-size:10px;color:var(--dim)}
  .cbar{height:14px;background:#10141a;border-radius:3px;position:relative}
  .cbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .cbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
  .crow .v{font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:right}

  .chart{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:12px 10px 6px;margin-top:10px}
  svg{width:100%;height:180px;display:block;overflow:visible}
  svg text{font-family:'IBM Plex Mono',monospace}
  .hint{font-size:11.5px;color:var(--dim);margin:10px 2px 0;line-height:1.6}
  footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="mode">
    <a href="index.html">히트맵</a>
    <a href="semi.html">산업</a>
    <a href="trend.html">트렌드</a>
    <a href="sentiment.html" class="on">센티멘트</a>
  </div>

  <header><h1>투자자 센티멘트</h1><span class="stamp" id="stamp">로딩</span></header>

  <div class="rulers" id="rulers"></div>

  <h2>구성요소</h2>
  <div class="segs" id="mkt"></div>
  <div class="comp" id="comp"></div>
  <p class="hint" id="chint"></p>

  <h2>추이 · 지수 대비</h2>
  <div class="segs" id="span"></div>
  <div class="chart"><svg id="hist" viewBox="0 0 340 200" preserveAspectRatio="none"
       style="height:200px"></svg>
    <div class="rlab" id="hlab" style="padding:6px 2px 0"></div></div>

  <h2>선행성</h2>
  <p class="hint" id="corrnote"></p>
  <div class="comp" id="fwd"></div>

  <footer id="foot"></footer>
</div>

<script>
const APP_VERSION="1.8.0";
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

const COL={'미국':'#e8edf2','한국':'#e2394a'};
let D=null, mkt='미국', span=1260;
const SPANS=[['1년',252],['3년',756],['5년',1260]];

/* 점수 → 말. 숫자만 있으면 60이 높은 건지 낮은 건지 매번 헷갈린다. */
function label(v){
  if(v===null) return '–';
  if(v>=75) return '강한 탐욕';
  if(v>=60) return '탐욕';
  if(v>=40) return '중립';
  if(v>=25) return '공포';
  return '강한 공포';
}
const scoreCol=v=>v===null?'var(--dim)':
  v>=60?'var(--greed)':v<=40?'var(--fear)':'var(--mid)';

fetch('sentiment.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  D=d;
  const kst=new Date(d.generated_at).toLocaleString('ko-KR',
    {timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('stamp').textContent=kst+' KST';

  document.getElementById('rulers').innerHTML=d.markets.map(m=>`
    <div class="ruler">
      <div class="rtop"><b>${m.name}</b>
        <span style="color:${scoreCol(m.score)}">${m.score===null?'–':m.score}
          <em style="font-style:normal;font-size:12px;font-family:inherit"> ${label(m.score)}</em>
        </span></div>
      <div class="track">${m.score===null?'':
        `<div class="pin" style="left:calc(${m.score}% - 1.5px)"></div>`}</div>
      <div class="rlab"><span>0 공포</span><span>50</span><span>탐욕 100</span></div>
    </div>`).join('');

  seg('mkt', d.markets.map(m=>[m.name,m.name]), mkt, v=>{mkt=v;comps();hist();fwd();});
  seg('span', SPANS.map(([l,n])=>[String(n),l]), String(span), v=>{span=+v;hist();});
  comps(); hist(); fwd();

  document.getElementById('foot').innerHTML=
    d.note+'<br>v'+APP_VERSION+' · 생성 '+d.generated_at;
}).catch(()=>{document.getElementById('stamp').textContent=
  'sentiment.json을 불러오지 못했습니다.';});

function seg(id,opts,cur,cb){
  const el=document.getElementById(id); el.innerHTML='';
  opts.forEach(([v,l])=>{
    const b=document.createElement('button');
    b.className='seg'+(v===cur?' on':''); b.textContent=l;
    b.onclick=()=>{[...el.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on'); cb(v);};
    el.appendChild(b);
  });
}

function comps(){
  const m=D.markets.find(x=>x.name===mkt);
  document.getElementById('comp').innerHTML=m.components.map(c=>{
    // invert 항목(변동성)은 이름 그대로 읽히도록 백분위를 그대로 보여준다.
    // 대신 색은 공포 방향으로 칠해서 '큰 숫자 = 공포'가 눈에 들어오게 한다.
    const shown = c.invert ? c.display : c.score;
    const color = c.invert ? scoreCol(100-c.display) : scoreCol(c.score);
    return `<div class="crow">
      <div class="nm">${c.label}${c.invert?'<sup style="color:var(--fear);font-size:9px"> 역</sup>':''}
        <em>${c.note}</em></div>
      <div class="cbar"><div class="mid"></div>
        <div class="f" style="width:${shown}%;background:${color}"></div></div>
      <div class="v" style="color:${color}">${shown}</div>
    </div>${c.flag?`<div style="font-size:10.5px;color:var(--dim);padding:0 0 8px 2px">
      ${c.flag}</div>`:''}`;
  }).join('');
  const hasInv=m.components.some(c=>c.invert);
  const invNote=hasInv?'"역" 표시 항목은 값이 클수록 공포이며, 종합 점수에는 뒤집어 반영된다. ':'';
  document.getElementById('chint').textContent= invNote + (
    mkt==='한국'
      ? (D.kr_note||'')+' 레버리지/인버스 거래대금 비율은 개인이 어느 방향에 실제로 베팅했는지를 보여준다.'
      : '각 구성요소는 2년 백분위다. 50이면 지난 2년의 딱 중간, 90이면 상위 10% 수준으로 위험을 사고 있다는 뜻이다.');
}

function hist(){
  const all=(D.history||{})[mkt]||[];
  const rows=all.slice(-span);
  const svg=document.getElementById('hist');
  if(rows.length<2){ svg.innerHTML=`<text x="170" y="90" fill="#8b97a4"
    text-anchor="middle" font-size="11">추이 데이터가 부족합니다</text>`; return; }
  const W=340,H=200,P={l:26,r:30,t:10,b:20};
  const X=i=>P.l+i/(rows.length-1)*(W-P.l-P.r);
  const Y=v=>H-P.b-v/100*(H-P.t-P.b);

  let g='';
  // 40·60 밴드 — 이 사이가 중립. 밖으로 나간 구간이 판단 지점이다
  g+=`<rect x="${P.l}" y="${Y(60)}" width="${W-P.l-P.r}" height="${Y(40)-Y(60)}"
       fill="#ffffff" fill-opacity=".04"/>`;
  [0,25,50,75,100].forEach(v=>{
    g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}"
         stroke="#232a32" stroke-width=".8"/>`;
    g+=`<text x="${P.l-4}" y="${Y(v)+3}" fill="#8b97a4" font-size="8"
         text-anchor="end">${v}</text>`;});

  // 지수를 오른쪽 축에 겹친다. 축이 다르므로 보조선처럼 얇게 그린다.
  const ps=rows.map(r=>r.p).filter(v=>v!==undefined);
  if(ps.length>2){
    const plo=Math.min(...ps), phi=Math.max(...ps);
    const PY=v=>H-P.b-(v-plo)/((phi-plo)||1)*(H-P.t-P.b);
    let pd='',started=false;
    rows.forEach((r,i)=>{ if(r.p===undefined) return;
      pd+=(started?'L':'M')+X(i).toFixed(1)+' '+PY(r.p).toFixed(1)+' '; started=true;});
    g+=`<path d="${pd}" fill="none" stroke="#f0b429" stroke-width="1.1"
         stroke-opacity=".75"/>`;
    [plo,phi].forEach(v=>{
      g+=`<text x="${W-P.r+3}" y="${PY(v)+3}" fill="#f0b429" font-size="7.5">
        ${v>=10000?(v/1000).toFixed(0)+'k':v.toFixed(0)}</text>`;});
  }

  let d='';
  rows.forEach((r,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(r.v).toFixed(1)+' '; });
  g+=`<path d="${d}" fill="none" stroke="${COL[mkt]}" stroke-width="1.6"/>`;
  const last=rows[rows.length-1];
  g+=`<circle cx="${X(rows.length-1)}" cy="${Y(last.v)}" r="3" fill="${COL[mkt]}"/>`;
  [0,Math.floor(rows.length/2),rows.length-1].forEach(i=>{
    g+=`<text x="${X(i)}" y="${H-6}" fill="#8b97a4" font-size="8"
         text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${rows[i].d.slice(2,7)}</text>`;});
  svg.innerHTML=g;
  document.getElementById('hlab').innerHTML=
    `<span style="color:${COL[mkt]}">━ 센티멘트 (왼쪽 0~100)</span>`+
    `<span style="color:#f0b429">━ ${(D.bench_idx||{})[mkt]||''} (오른쪽)</span>`;
}

/* 선행성 — '지금 이 수준이 앞으로 무엇을 뜻했나'를 과거로 답한다.
   동시점 상관은 거의 항상 양수라(오르면 심리가 좋아지니) 판단에 쓰이지 않는다. */
function fwd(){
  const st=(D.stats||{})[mkt]||{};
  const el=document.getElementById('fwd');
  const note=document.getElementById('corrnote');
  if(!st.buckets60){ el.innerHTML=''; note.textContent='표본이 부족합니다.'; return; }

  note.textContent=
    `동시점 상관 ${st.corr_same} · 이후 20일 ${st.corr20} · 이후 60일 ${st.corr60} `+
    `(표본 ${st.n}일). 동시점은 높고 선행 상관은 0에 가깝다면, 심리는 시장을 `+
    `예고하는 게 아니라 따라간다는 뜻이다.`;

  const rows=st.buckets60;
  const mx=Math.max(...rows.map(r=>Math.abs(r.avg)))||1;
  el.innerHTML=rows.map(r=>{
    const w=Math.abs(r.avg)/mx*50;
    const pos=r.avg>=0;
    return `<div class="crow">
      <div class="nm">센티 ${r.range}<em>표본 ${r.n}일</em></div>
      <div class="cbar"><div class="mid"></div>
        <div class="f" style="${pos?`left:50%;width:${w}%`:`left:${50-w}%;width:${w}%`};
          background:${pos?'var(--greed)':'var(--fear)'}"></div></div>
      <div class="v" style="color:${pos?'var(--greed)':'var(--fear)'}">${
        (r.avg>=0?'+':'')+r.avg}%</div>
    </div>`;
  }).join('')+
  `<div style="font-size:10.5px;color:var(--dim);padding:8px 2px 0">
     각 구간에 있던 날들의 <b>이후 60일 평균 수익률</b>. 과거 5년 표본이며 미래를 보장하지 않는다.</div>`;
}
</script>
</body>
</html>
