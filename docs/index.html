<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>마켓 히트맵</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --line:#232a32;
    --txt:#e8edf2; --dim:#8b97a4;
    --up3:#e2394a; --up1:#7a2733; --flat:#2b3138; --dn1:#1d4a6b; --dn3:#2e8fd6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'IBM Plex Sans KR',system-ui,sans-serif;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100dvh}

  .mode{display:flex;gap:6px;padding:10px 14px 0;flex:none}
  .mode a{flex:1;text-align:center;padding:7px;border-radius:9px;text-decoration:none;
    border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:13px}
  .mode a.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:600}
  header{padding:8px 14px 0;flex:none}
  .ttl{display:flex;align-items:baseline;gap:9px}
  .ttl h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
  .ttl span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim)}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 9px;
    scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--dim);font-size:13px;font-weight:500;cursor:pointer}
  .tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:600}

  .bar{display:flex;align-items:center;justify-content:space-between;
    padding:0 14px 8px;flex:none;font-size:11px;color:var(--dim)}
  .scale{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace}
  .scale i{width:15px;height:9px;display:block;border-radius:1px}
  .grp{background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer}
  .grp.on{color:var(--txt);border-color:var(--dim)}

  #map{flex:1;min-height:0;padding:0 8px 8px}
  svg{width:100%;height:100%;display:block}
  .cell rect{stroke:var(--bg);stroke-width:1.2}
  .cell text{pointer-events:none;font-weight:600;fill:#fff;
    paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
  .cell .pct{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .sec-label{fill:var(--dim);font-size:9.5px;font-weight:600;letter-spacing:.04em}

  /* 상세 시트 */
  #sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
    border-top:1px solid var(--line);padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:9}
  #sheet.on{transform:translateY(0)}
  #sheet .grab{width:34px;height:3px;background:var(--line);border-radius:2px;
    margin:-6px auto 13px}
  #sheet h2{margin:0 0 2px;font-size:19px;letter-spacing:-.02em}
  #sheet .sub{color:var(--dim);font-size:11.5px;font-family:'IBM Plex Mono',monospace;
    margin-bottom:14px}
  .row{display:flex;justify-content:space-between;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .row:last-of-type{border-bottom:0}
  .row i{font-style:normal;color:var(--dim)}
  .row b{font-family:'IBM Plex Mono',monospace;font-weight:600}
  #sheet button{margin-top:14px;width:100%;padding:11px;background:none;
    border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:13px;cursor:pointer}
  #msg{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px}
  @media(prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="mode">
    <a href="index.html" class="on">히트맵</a>
    <a href="semi.html">산업</a>
    <a href="trend.html">트렌드</a>
    <a href="sentiment.html">센티멘트</a>
  </div>
  <header>
    <div class="ttl"><h1>마켓 히트맵</h1><span id="stamp">로딩</span></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div class="bar2" id="bar2"></div>
  <div class="bar">
    <div class="scale">
      <span>-3%</span>
      <i style="background:var(--dn3)"></i><i style="background:var(--dn1)"></i>
      <i style="background:var(--flat)"></i>
      <i style="background:var(--up1)"></i><i style="background:var(--up3)"></i>
      <span>+3%</span>
    </div>
    <div style="display:flex;gap:6px">
      <button class="grp" id="soft">비중 완화</button>
      <button class="grp on" id="grp">섹터 묶기</button>
    </div>
  </div>
  <div class="health" id="health"></div>
  <div id="map"><div id="msg">불러오는 중…</div></div>
</div>

<div id="sheet">
  <div class="grab"></div>
  <h2 id="s-name">–</h2>
  <div class="sub" id="s-sym">–</div>
  <div id="s-rows"></div>
  <button id="s-star">☆ 관심종목에 담기</button>
  <button id="s-close">닫기</button>
</div>

<script>
const APP_VERSION="1.7.2";
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')
    .catch(e=>console.warn('SW 등록 실패',e)));

const CS=['--dn3','--dn1','--flat','--up1','--up3'].map(v=>
  getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const color=d3.scaleLinear().domain([-3,-1,0,1,3]).range(CS).clamp(true);
const fmtCap=v=>v>=1e12?(v/1e12).toFixed(2)+'T':v>=1e9?(v/1e9).toFixed(1)+'B':(v/1e6).toFixed(0)+'M';
const fmtPct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';
const fmtNum=v=>v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):v.toFixed(2);

let DATA=null, view='ALL', grouped=true, soften=false;
let period='chg', inUSD=false, starsOnly=false;
const PERIOD_LABEL={chg:'1일',d5:'1주',d20:'1개월',ytd:'YTD'};

/* 관심종목은 브라우저에 남긴다. 서버가 없어도 '내 종목'이 성립한다. */
function stars(){ try{ return new Set(JSON.parse(localStorage.getItem('mh_stars')||'[]')); }
  catch(e){ return new Set(); } }
function toggleStar(sym){
  const s=stars();
  s.has(sym)?s.delete(sym):s.add(sym);
  localStorage.setItem('mh_stars',JSON.stringify([...s]));
}

/* 등락률을 달러 기준으로 환산한다. 현지 통화 수익률만 보면
   원화가 7% 빠진 구간에서 한국 종목이 실제보다 좋아 보인다. */
function chgOf(r){
  const v=r[period];
  if(v===null||v===undefined) return null;
  if(!inUSD) return v;
  const f=(DATA.fx_perf||{})[r.ccy];
  if(!f||f[period]===null||f[period]===undefined) return v;
  return v+f[period];
}

function buildBar2(){
  const el=document.getElementById('bar2');
  const mk=(label,on,cb)=>{
    const b=document.createElement('button');
    b.className='tab'+(on?' on':''); b.textContent=label;
    b.onclick=()=>{cb(b);}; return b;
  };
  el.innerHTML='';
  Object.entries(PERIOD_LABEL).forEach(([k,label])=>{
    el.appendChild(mk(label,k===period,b=>{
      period=k;
      [...el.querySelectorAll('.tab')].slice(0,4).forEach(c=>c.classList.remove('on'));
      b.classList.add('on'); draw(); stampArea();
    }));
  });
  el.appendChild(mk('USD',inUSD,b=>{inUSD=!inUSD;b.classList.toggle('on',inUSD);
    draw(); stampArea();}));
  el.appendChild(mk('★ 내 종목',starsOnly,b=>{
    if(!starsOnly && stars().size===0){
      alert('종목을 눌러 상세를 연 뒤 ★를 눌러 담아 주세요.'); return;
    }
    starsOnly=!starsOnly; b.classList.toggle('on',starsOnly); draw();
  }));
}

fetch('heatmap.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  const kst=new Date(d.generated_at).toLocaleString('ko-KR',
    {timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  document.getElementById('stamp').textContent=kst+' KST · v'+APP_VERSION;
  stampArea();
  const tabs=document.getElementById('tabs');
  const list=[['ALL','전체'],...Object.entries(d.markets).map(([k,v])=>[k,v.label])];
  list.forEach(([k,label])=>{
    const b=document.createElement('button');
    b.className='tab'+(k===view?' on':''); b.textContent=label;
    b.onclick=()=>{view=k;[...tabs.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');draw();};
    tabs.appendChild(b);
  });
  buildBar2();
  const bad=(d.health||[]).filter(h=>!h.ok);
  document.getElementById('health').innerHTML = bad.length
    ? '<b>수집 실패: '+bad.map(h=>h.step).join(', ')+'</b> — 아래 수치는 이전 값일 수 있습니다'
    : (d.health||[]).map(h=>h.step+' '+h.n).join(' · ');
  draw();
  // 웹폰트가 늦게 로드되면 폴백 폰트 기준으로 잰 폭이 실제와 달라져
  // 라벨이 타일 밖으로 넘친다. 폰트 준비 후 한 번 더 그린다.
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
  window.addEventListener('resize',()=>{clearTimeout(window._t);
    window._t=setTimeout(draw,180);});
}).catch(()=>{document.getElementById('msg').textContent=
  'heatmap.json을 불러오지 못했습니다. 수집 워크플로우 실행 후 다시 열어 주세요.';});

document.getElementById('grp').onclick=e=>{
  grouped=!grouped; e.target.classList.toggle('on',grouped); draw();};
document.getElementById('soft').onclick=e=>{
  soften=!soften; e.target.classList.toggle('on',soften); draw(); stampArea();};
document.getElementById('s-close').onclick=()=>
  document.getElementById('sheet').classList.remove('on');

function stampArea(){
  const el=document.getElementById('stamp');
  const base=el.dataset.base||(el.dataset.base=el.textContent);
  // 무엇을 보고 있는지 화면에 항상 적는다. 기간·통화·면적은 다 오해를 부르는 축이다.
  let t=base+' · '+PERIOD_LABEL[period];
  if(inUSD) t+=' · USD';
  if(soften) t+=' · 면적 완화';
  el.textContent=t;
}

function rows(){
  let out;
  if(view==='ALL') out=Object.entries(DATA.markets)
    .flatMap(([m,v])=>v.items.map(x=>({...x,mkt:v.label})));
  else { const v=DATA.markets[view]; out=v.items.map(x=>({...x,mkt:v.label})); }
  if(starsOnly){ const st=stars(); out=out.filter(x=>st.has(x.sym)); }
  return out;
}

function draw(){
  const el=document.getElementById('map'); el.innerHTML='';
  const W=el.clientWidth, H=el.clientHeight;
  if(!W||!H) return;
  const data=rows().filter(r=>r.cap_usd>0);
  if(!data.length){el.innerHTML='<div id="msg">'+
    (starsOnly?'담아 둔 종목이 없습니다. ★ 내 종목을 끄고 종목을 눌러 담아 주세요.'
             :'표시할 종목이 없습니다.')+'</div>';return;}

  // 그룹 키: 전체 보기에서는 시장, 개별 시장에서는 섹터
  const key=r=>view==='ALL'?r.mkt:r.sector;
  const root=d3.hierarchy(
    grouped
      ? {children:d3.groups(data,key).map(([k,v])=>({name:k,children:v}))}
      : {children:data}
  ).sum(d=>soften?Math.pow(d.cap_usd,0.6):d.cap_usd)
   .sort((a,b)=>b.value-a.value);

  const pad=grouped?{top:13,inner:1.5}:{top:0,inner:1.5};
  d3.treemap().size([W,H]).paddingTop(pad.top)
    .paddingInner(pad.inner).round(true)(root);

  const svg=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`);

  if(grouped){
    svg.selectAll('.sec-label').data(root.children||[]).join('text')
      .attr('class','sec-label').attr('x',d=>d.x0+2).attr('y',d=>d.y0+10)
      .text(d=>(d.x1-d.x0)>52?d.data.name:'');
  }

  const defs=svg.append('defs');
  const g=svg.selectAll('.cell').data(root.leaves()).join('g')
    .attr('class','cell').attr('transform',d=>`translate(${d.x0},${d.y0})`)
    .attr('clip-path',(d,i)=>{
      defs.append('clipPath').attr('id','clip'+i).attr('clipPathUnits','userSpaceOnUse')
        .append('rect').attr('width',d.x1-d.x0).attr('height',d.y1-d.y0);
      return `url(#clip${i})`;
    })
    .style('cursor','pointer').on('click',(e,d)=>open(d.data));

  g.append('rect').attr('width',d=>d.x1-d.x0).attr('height',d=>d.y1-d.y0)
    .attr('fill',d=>color(chgOf(d.data)??0));

  // Finviz 원칙: 모든 타일은 무언가를 말한다. 빈 상자를 남기지 않는다.
  //
  // Finviz가 이 문제를 겪지 않는 건 라틴 티커가 1~5자로 짧기 때문이다.
  // 한글은 글자당 폭이 라틴의 두 배라 같은 방식으로는 절반이 빈 상자가 된다.
  // 그래서 후퇴 경로를 네 단계로 둔다.
  //   1) 가로로 들어가는 가장 긴 이름 (정식명 → 축약명 → 라틴 티커)
  //   2) 좁고 긴 타일이면 글자를 세로로 쌓는다 (한글은 세로쓰기가 자연스럽다)
  //   3) 그래도 안 되면 등락률만 (이름을 몰라도 색과 숫자는 정보다)
  //   4) 정말 아무것도 안 들어갈 때만 비운다
  const MIN_FS = 6;
  const latin=d=>{
    const t=(d.sym||'').replace(/-USD$/,'').split('.')[0];
    return /^[A-Za-z][A-Za-z0-9&.\-]*$/.test(t)?t:'';
  };

  // 한 줄 텍스트를 넣어보고, 실측 폭에 맞춰 폰트를 조정한다.
  // 추정하지 않고 재는 이유는 한글·라틴·숫자의 글자폭이 전부 다르기 때문이다.
  function fitLine(node, text, w, h, y, cls, maxFs){
    const t=node.append('text')
      .attr('x',w/2).attr('y',y).attr('text-anchor','middle')
      .attr('dominant-baseline','middle').style('font-size',maxFs+'px');
    if(cls) t.attr('class',cls);
    t.text(text);
    const len=t.node().getComputedTextLength();
    if(len>0){
      const scaled=Math.min(maxFs, maxFs*(w-4)/len);
      if(scaled<MIN_FS){ t.remove(); return 0; }
      t.style('font-size',scaled+'px');
      return scaled;
    }
    t.remove();
    return 0;
  }

  // 좁고 긴 타일: 글자를 세로로 쌓는다
  function fitVertical(node, text, w, h){
    const chars=[...text];
    const fs=Math.min(w-3, h/chars.length-1, 15);
    if(fs<MIN_FS) return false;
    const t=node.append('text')
      .attr('x',w/2).attr('text-anchor','middle')
      .style('font-size',fs+'px');
    const top=(h-chars.length*fs*1.05)/2 + fs*0.6;
    chars.forEach((c,i)=>t.append('tspan')
      .attr('x',w/2).attr('y',top+i*fs*1.05).text(c));
    return true;
  }

  const st=stars();
  g.each(function(d){
    const w=d.x1-d.x0, h=d.y1-d.y0;
    if(w<14||h<11) return;              // 이보다 작으면 6px도 안 들어간다
    const n=d3.select(this);
    if(st.has(d.data.sym) && w>22 && h>16)
      n.append('text').attr('x',w-3).attr('y',9).attr('text-anchor','end')
        .style('font-size','9px').style('fill','#ffd166').text('★');
    const pct=fmtPct(chgOf(d.data)??0);
    const cands=[d.data.name, d.data.short, latin(d.data)].filter(Boolean);

    // 1) 가로 한 줄
    for(const text of cands){
      const twoLine = h>30 && w>36;
      const maxFs=Math.min(h*(twoLine?0.34:0.55), 17);
      if(maxFs<MIN_FS) break;
      const fs=fitLine(n, text, w, h, h/2-(twoLine?maxFs*0.55:0), null, maxFs);
      if(!fs) continue;
      if(twoLine) fitLine(n, pct, w, h, h/2+fs*0.70, 'pct', fs*0.8);
      return;
    }

    // 2) 세로 쌓기 — 좁고 긴 타일
    if(h>=w*2.2){
      for(const text of cands){
        if([...text].length<=5 && fitVertical(n, text, w, h)) return;
      }
    }

    // 3) 등락률만이라도
    if(fitLine(n, pct, w, h, h/2, 'pct', Math.min(h*0.55, 13))) return;
  });
}

function open(d){
  document.getElementById('s-name').textContent=d.name;
  document.getElementById('s-sym').textContent=`${d.sym} · ${d.mkt} · ${d.sector}`;

  // 같은 섹터 평균과 비교한다. 혼자 빠진 것과 업종이 다 빠진 것은 완전히 다른 신호다.
  const peers=rows().filter(x=>x.sector===d.sector&&x.mkt===d.mkt
    &&x[period]!==null&&x[period]!==undefined);
  const avg=peers.length>1
    ? peers.reduce((a,b)=>a+b[period],0)/peers.length : null;
  const rel=(avg===null||d[period]===null)?null:d[period]-avg;

  const line=(l,v)=>`<div class="row"><i>${l}</i>
    <b style="color:${v===null||v===undefined?'var(--dim)':color(v)}">${
      v===null||v===undefined?'–':fmtPct(v)}</b></div>`;
  document.getElementById('s-rows').innerHTML=
    line('1일',d.chg)+line('1주',d.d5)+line('1개월',d.d20)+line('연초 대비',d.ytd)+
    (rel===null?'':`<div class="row"><i>${d.sector} 평균 대비 (${PERIOD_LABEL[period]})</i>
      <b style="color:${color(rel)}">${fmtPct(rel)}p</b></div>`)+
    `<div class="row"><i>현재가</i><b>${fmtNum(d.price)} ${d.ccy}</b></div>
     <div class="row"><i>시가총액</i><b>$${fmtCap(d.cap_usd)}</b></div>`+
    (d.ccy==='USD'?'':
      `<div class="row"><i>현지 시총</i><b>${fmtCap(d.cap_local)} ${d.ccy}</b></div>`);

  const btn=document.getElementById('s-star');
  const on=stars().has(d.sym);
  btn.textContent=on?'★ 관심종목에서 빼기':'☆ 관심종목에 담기';
  btn.onclick=()=>{toggleStar(d.sym);open(d);draw();};
  document.getElementById('sheet').classList.add('on');
}
</script>
</body>
</html>
